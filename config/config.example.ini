; x_collector.py の設定ファイル（見本）。<ルート>/config/config.ini にコピーして値を埋める。
; このファイルには秘密情報（アプリパスワード・ログインCookie）が入るので、
; 他人と共有しない・Gitに入れない（.gitignoreに config.ini を追加しておくと安全）。

[mail]
; Gmail送信元アドレス（例: you@gmail.com）
gmail_user = 
; Gmailの「アプリパスワード」（2段階認証を有効にした上でGoogleアカウント設定から発行する16桁）
gmail_app_password = 
; 送信先（当面は個人アドレス推奨。要件D5=会社アドレス配信のコンプラ確認が済むまで）
mail_to = 

[x]
; 捨て垢セッションのCookie値。取得手順は auth-session-setup.md 参照
auth_token = 
ct0 = 

[llm]
; Groq の APIキー（https://console.groq.com/keys で発行。クレジットカード不要）
api_key = 
; 使うモデル。空ならコードの既定値(openai/gpt-oss-120b)。
; 軽くしたい場合は openai/gpt-oss-20b、別系統なら qwen/qwen3.8-27b など。
; ※モデル名は変わりやすい。404が出たら console.groq.com/docs/models で現行名を確認する。
model = 
; 無料枠のレート上限に合わせた送信ペース（空なら 25req/分・5000トークン/分）。
; 実際の上限はGroqのアカウント設定 Limits ページで確認できる。
rpm = 
tpm = 
